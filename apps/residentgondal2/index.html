<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Resident Gondal VR: Kebab Outbreak</title>
  <meta name="description" content="Survival arcade roguelite con oleadas, bosses, mejoras y GondalDex." />
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#04050a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff;touch-action:none;}
    #game{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1a1744,#05060b 70%)}
    canvas{display:block;image-rendering:auto}
    .loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#201c3d,#05060b 68%);z-index:-1;color:#dfe7ff}
    .loading strong{display:block;color:#ffdb68;font-size:1.7rem;text-shadow:0 0 20px #ff3d81}
  </style>
</head>
<body>
  <div class="loading"><div><strong>Resident Gondal VR</strong>Cargando brote kebab...</div></div>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
